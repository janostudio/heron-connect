# Slack + Claude Code
# Socket Mode WebSocket，无需公网 IP

[log]
level = "info"

[[projects]]
name = "my-bot"

[projects.agent]
type = "claudecode"

[projects.agent.options]
work_dir = "/path/to/your/project"
mode = "default"

[[projects.platforms]]
type = "slack"

[projects.platforms.options]
bot_token = "xoxb-your-bot-token"
app_token = "xapp-your-app-level-token"
allow_from = "*"
