# QQ（NapCat/OneBot）+ Claude Code
# WebSocket 连接本地 NapCat

[log]
level = "info"

[[projects]]
name = "my-bot"

[projects.agent]
type = "claudecode"

[projects.agent.options]
work_dir = "/path/to/your/project"
mode = "default"

[[projects.platforms]]
type = "qq"

[projects.platforms.options]
ws_url = "ws://127.0.0.1:3001"
token = ""
allow_from = "*"
