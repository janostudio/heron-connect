name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 与 heron-ai 的发布方式保持一致：打 tag 即发布，产物与 npm 包都由流水线产出，
# 不再依赖本地 make publish（那需要本机的 gh 认证与 NPM_TOKEN）。
#
# 本地 make publish 仍然可用，两者共用 npm/release-assets.js：
#   - ensure 会创建 GitHub Release 并上传 dist/ 归档
#   - npm publish 的 prepublishOnly 也会调 ensure，流水线里已先跑一次，故跳过脚本避免重复
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore web dependencies
        # `make web` installs only when web/node_modules is missing, and every
        # CI run starts from a fresh checkout — so each release re-downloaded
        # the whole frontend dependency tree. That download is the slowest and
        # most fragile step of the pipeline: 2026-10-28 gave two consecutive
        # releases killed by `npm error network read ECONNRESET` after ~3.5
        # minutes each, and the successful run still spent 196s there.
        #
        # The cache key is the lockfile hash, so a changed dependency list
        # misses the cache and installs from scratch; identical lists restore
        # the tree and `make web` goes straight to `npm run build`.
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-deps-${{ runner.os }}-node20-${{ hashFiles('web/package-lock.json') }}

      - name: Build web assets
        # web/embed.go embeds all:dist, so every package that links the
        # connector fails to compile until the frontend is built. Doing it
        # before the tests keeps `go test ./...` from reporting three
        # "[setup failed]" packages as if the code were broken.
        run: make web

      - name: Run tests
        run: go test ./...

      - name: Cross-compile and package
        run: make release-all VERSION=${GITHUB_REF_NAME}

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node npm/release-assets.js ensure

      - name: Build npm packages
        run: |
          # 版本必须与 tag 一致，否则会发出一个与 Release 对不上的 npm 包。
          PKG_VERSION=$(node -p "require('./npm/package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::npm/package.json 版本 $PKG_VERSION 与 tag $GITHUB_REF_NAME 不一致；先 bump 版本号再打 tag"
            exit 1
          fi
          # 二进制随平台包发布，主包只带包装脚本。
          node npm/make-platform-packages.js --dist dist --out npm-dist --version "$TAG_VERSION"

      - name: Publish platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          # npm 对无效/过期的 token 返回 404（"'<pkg>@<version>' is not in this
          # registry"）而不是 401，看起来像"包不存在/没权限发布"，极易误诊。
          # 发布前先确认 token 有效，失败就明确报认证问题并终止。
          npm whoami || { echo "::error::NPM_TOKEN 无效或已过期（npm whoami 失败）；请到 npm 账户重新生成 token 并更新仓库 secret NPM_TOKEN"; exit 1; }
          TAG_VERSION=${GITHUB_REF_NAME#v}
          # 平台包是同一包名的预发布版本（<version>-<platform>），必须显式 --tag：
          # npm publish 默认把版本挂到 latest，那样 `npm install <pkg>` 会装到某个平台包。
          for dir in npm-dist/platform-*; do
            key="${dir#npm-dist/platform-}"
            echo "::group::publish ${key}"
            ( cd "$dir" && npm publish --access public --tag "platform-${TAG_VERSION}-${key}" )
            echo "::endgroup::"
          done

      - name: Publish main package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 平台包全部发布成功后才发主包：主包的 optionalDependencies 指向它们。
          cd npm-dist/main
          npm publish --access public
